spring.application.name=InventoryService
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/thriftBerry_inventory_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================
# Kafka Configuration
# =========================
spring.kafka.bootstrap-servers=localhost:9092

# Consumer config
spring.kafka.consumer.group-id=inventory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false


spring.kafka.consumer.properties.spring.json.value.default.type=com.thriftBerry.inventoryService.dto.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*